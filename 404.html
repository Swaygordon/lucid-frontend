    <title>Lucid — Trusted Local Services, Instantly</title>
    <script type="module" crossorigin src="/lucid-frontend/assets/index-Dw0dIAF1.js"></script>
    <link rel="stylesheet" crossorigin href="/lucid-frontend/assets/index-DvOcBMbj.css">
  <script>
        (() => {
          const route = new URLSearchParams(window.location.search).get('gh_route');
          if (!route) return;
          window.history.replaceState(null, '', "/lucid-frontend" + route);
        })();
      </script>
<script>
        (() => {
          const basePath = "/lucid-frontend";
          const path = window.location.pathname.startsWith(basePath)
            ? window.location.pathname.slice(basePath.length)
            : '';
          const route = '/' + path.replace(/^\//, '') + window.location.search + window.location.hash;
          window.location.replace(basePath + '/?gh_route=' + encodeURIComponent(route));
        })();
      </script>
</head>
  <body>
    <div id="root"></div>
  </body>
